services:
  postgres:
    image: postgres:16-alpine
    container_name: streamhive-admin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: streamhive
      POSTGRES_PASSWORD: streamhive
      POSTGRES_DB: streamhive_admin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamhive -d streamhive_admin"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamhive-admin-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api
      CORS_ORIGIN: "*"
      DATABASE_URL: postgresql://streamhive:streamhive@postgres:5432/streamhive_admin?schema=public
      JWT_ACCESS_SECRET: change-me-in-production-access
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: change-me-in-production-refresh
      JWT_REFRESH_EXPIRES_IN: 7d
      LOG_LEVEL: info
    ports:
      - "3000:3000"

volumes:
  postgres-data:
